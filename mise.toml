# Tool versions and tasks. mise also activates the uv virtual environment.
[tools]
python = "3.14"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Sync dependencies from the lockfile"
run = "uv sync --all-extras"

[tasks.fmt]
description = "Format the code (modifies files)"
run = "uv run ruff format ."

[tasks.lint]
description = "Lint and autofix (modifies files)"
run = "uv run ruff check --fix ."

[tasks.fix]
description = "Format and autofix. Use before committing, not as a gate."
depends = ["fmt", "lint"]

[tasks.typecheck]
description = "Type-check the code"
run = "uv run mypy ."

[tasks.test]
description = "Run the tests"
run = "uv run pytest"

# Verification tasks never modify the tree. A gate that repairs what it
# measures cannot fail on drift -- it just fixes it and reports success,
# leaving the change uncommitted.
[tasks.check-fmt]
description = "Fail if the code is unformatted"
run = "uv run ruff format --check ."

[tasks.check-lint]
description = "Fail on a lint error, fixing nothing"
run = "uv run ruff check ."

[tasks.check]
description = "Every gate, verify-only. Never modifies the tree."
depends = ["check-fmt", "check-lint", "typecheck", "test"]

[tasks.build]
description = "Build the wheel and the source distribution"
run = "uv build"

[tasks.doctor]
description = "Check the GitHub account against the taxonomy (read-only)"
run = "uv run ghstars doctor"
