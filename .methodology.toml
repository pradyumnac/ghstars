# Records the selected project methodology for compliance checks.

[project]
type = "app"
python_floor = "3.14"
python_floor_reason = "Latest stable Python; the installation tools provide the interpreter."

[tooling]
task_runner = "mise"
build_backend = "uv_build"
pre_commit = true
remote_ci = true

[practice]
methodology = "mattpocock"
licence = "MIT"
pypi = true
xdg_paths = false
git_cliff = true
pydantic_edges = true

