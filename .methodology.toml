# Written by pradyumnac-python-bootstrap. Records what this project chose.
# Skills read this file to check the project against its own intent.

[project]
type = "app"
python_floor = "3.14"
python_floor_reason = "Latest stable Python; single-developer tool installed via uv tool install/mise which bundles its own interpreter, so there is no compatibility-floor cost to picking latest."

[tooling]
task_runner = "mise"
build_backend = "uv_build"
pre_commit = true
remote_ci = true

[practice]
methodology = "mattpocock"
licence = "MIT"
pypi = true
xdg_paths = false
git_cliff = true
pydantic_edges = true

[meta]
